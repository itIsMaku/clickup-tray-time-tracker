[package]
name = "clickup-tracker"
version = "0.1.0"
edition = "2024"
description = "A small native ClickUp timer for the macOS menu bar and Windows tray"
license = "MIT"
repository = "https://github.com/itIsMaku/clickup-tray-time-tracker"
homepage = "https://github.com/itIsMaku/clickup-tray-time-tracker"
readme = "README.md"
keywords = ["clickup", "time-tracking", "tray", "gpui", "desktop"]
categories = ["gui"]

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit", "dep:gpui-tray", "dep:keyring", "dep:dirs", "dep:fs2", "dep:rust-i18n"]

[dependencies]
anyhow = "1"
async-channel = "2"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = { version = "4.2.4", optional = true }
gpui-kit = { version = "=0.9.0", optional = true }
gpui-tray = { version = "0.3", default-features = false, features = ["gpui-kit"], optional = true }
dirs = { version = "6", optional = true }
fs2 = { version = "0.4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"], optional = true }

[[bin]]
name = "clickup-tracker"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
